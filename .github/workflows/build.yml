name: Build Simitone

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration'
        required: false
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug
      build_windows:
        description: 'Build Windows'
        type: boolean
        default: true
      build_linux:
        description: 'Build Linux'
        type: boolean
        default: true
      build_macos:
        description: 'Build macOS'
        type: boolean
        default: true

jobs:
  build-windows:
    if: ${{ inputs.build_windows }}
    runs-on: windows-latest
    name: Build Windows

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup .NET 9
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Run Protobuild
      shell: pwsh
      run: |
        cd FreeSO/Other/libs/FSOMonoGame/
        ./protobuild.exe --generate
      continue-on-error: true

    - name: Restore Simitone dependencies
      run: dotnet restore Client/Simitone/Simitone.sln

    - name: Restore FreeSO dependencies
      run: dotnet restore FreeSO/TSOClient/FreeSO.sln
      continue-on-error: true

    - name: Restore Roslyn dependencies
      shell: pwsh
      run: |
        cd FreeSO/TSOClient/FSO.SimAntics.JIT.Roslyn/
        dotnet restore
      continue-on-error: true

    - name: Build Windows
      run: dotnet build Client/Simitone/Simitone.Windows/Simitone.Windows.csproj -c ${{ inputs.configuration || 'Release' }} --no-restore

    - name: Build Windows Launcher (Native AOT)
      run: |
        dotnet publish Client/Simitone/Simitone.Launcher/Simitone.Launcher.csproj `
          -c ${{ inputs.configuration || 'Release' }} `
          -r win-x64 `
          -o publish/launcher-win

    - name: Create Windows release structure
      shell: pwsh
      run: |
        $config = "${{ inputs.configuration || 'Release' }}"
        $buildOutput = "Client/Simitone/Simitone.Windows/bin/$config/net9.0-windows"
        New-Item -ItemType Directory -Path "release/Simitone-Windows/lib" -Force
        Copy-Item -Path "publish/launcher-win/Simitone.exe" -Destination "release/Simitone-Windows/Simitone.exe"
        Copy-Item -Path "$buildOutput/*" -Destination "release/Simitone-Windows/lib/" -Recurse
        # Remove unused TSO/server content (not needed in TS1/Simitone mode)
        $unusedDirs = @(
          "release/Simitone-Windows/lib/Content/Objects",
          "release/Simitone-Windows/lib/Content/Patch",
          "release/Simitone-Windows/lib/Content/Avatar",
          "release/Simitone-Windows/lib/Content/MeshReplace",
          "release/Simitone-Windows/lib/Content/iOS",
          "release/Simitone-Windows/lib/Content/Cities",
          "release/Simitone-Windows/lib/Content/Blueprints",
          "release/Simitone-Windows/lib/DatabaseScripts",
          "release/Simitone-Windows/lib/MailTemplates",
          "release/Simitone-Windows/lib/IDERes"
        )
        foreach ($dir in $unusedDirs) {
          if (Test-Path $dir) { Remove-Item -Recurse -Force $dir }
        }
        foreach ($locale in @("ru","ja","fr","de","it","pl","ko","es","pt-BR","tr","cs","zh-Hans","zh-Hant","sv","ro","hu")) {
          $d = "release/Simitone-Windows/lib/$locale"
          if (Test-Path $d) { Remove-Item -Recurse -Force $d }
        }
        # Keep only win/ and win-x64/ native runtimes — drop android, iOS, linux, osx, etc.
        $runtimesDir = "release/Simitone-Windows/lib/runtimes"
        if (Test-Path $runtimesDir) {
          Get-ChildItem $runtimesDir -Directory |
            Where-Object { $_.Name -notin @("win", "win-x64") } |
            ForEach-Object { Remove-Item $_.FullName -Recurse -Force }
        }

    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Simitone-Windows-${{ inputs.configuration || 'Release' }}
        path: release/Simitone-Windows/
        if-no-files-found: error

  build-linux:
    if: ${{ inputs.build_linux }}
    runs-on: ubuntu-24.04
    name: Build Linux

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup .NET 9
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsdl2-2.0-0 libopenal1 libgtk-3-0 libgtk-3-dev libglib2.0-0 libcairo2 libpango-1.0-0 libgdk-pixbuf2.0-0 libatk1.0-0 imagemagick

    - name: Restore dependencies
      run: dotnet restore Client/Simitone/Simitone.Desktop/Simitone.Desktop.csproj

    - name: Build Linux
      run: dotnet build Client/Simitone/Simitone.Desktop/Simitone.Desktop.csproj -c ${{ inputs.configuration || 'Release' }} --no-restore

    - name: Publish Linux (self-contained)
      run: |
        dotnet publish Client/Simitone/Simitone.Desktop/Simitone.Desktop.csproj \
          -c ${{ inputs.configuration || 'Release' }} \
          -r linux-x64 \
          --self-contained true \
          -o publish/linux-x64 \
          /p:TreatWarningsAsErrors=false \
          /p:WarningsAsErrors=""

    - name: Build Linux Launcher (Native C)
      run: |
        mkdir -p publish/launcher-native
        gcc -O2 -s Client/Simitone/Simitone.Launcher/launcher.c -o publish/launcher-native/Simitone

    - name: Create Linux release structure
      run: |
        mkdir -p release/Simitone-Linux-x64/lib
        cp publish/launcher-native/Simitone release/Simitone-Linux-x64/Simitone
        chmod +x release/Simitone-Linux-x64/Simitone
        cp -r publish/linux-x64/* release/Simitone-Linux-x64/lib/
        # Remove unused TSO/server content (not needed in TS1/Simitone mode)
        for d in Content/Objects Content/Patch Content/Avatar Content/MeshReplace Content/iOS Content/Cities Content/Blueprints DatabaseScripts MailTemplates IDERes; do
          rm -rf "release/Simitone-Linux-x64/lib/$d"
        done
        for locale in ru ja fr de it pl ko es pt-BR tr cs zh-Hans zh-Hant sv ro hu; do
          rm -rf "release/Simitone-Linux-x64/lib/$locale"
        done
        # Keep only linux* and unix* native runtimes
        if [ -d release/Simitone-Linux-x64/lib/runtimes ]; then
          for d in release/Simitone-Linux-x64/lib/runtimes/*/; do
            case "$(basename "$d")" in linux*|unix*) ;; *) rm -rf "$d" ;; esac
          done
        fi
        cp Client/Simitone/Simitone.Launcher/simitone.desktop release/Simitone-Linux-x64/
        chmod +x release/Simitone-Linux-x64/simitone.desktop
        # Convert icon to PNG
        convert Client/Simitone/Simitone.Windows/Icon.ico -resize 256x256 release/Simitone-Linux-x64/lib/Resources/icon.png || true

    - name: Upload Linux artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Simitone-Linux-x64-${{ inputs.configuration || 'Release' }}
        path: release/Simitone-Linux-x64/
        if-no-files-found: error

  build-macos:
    if: ${{ inputs.build_macos }}
    runs-on: macos-latest
    name: Build macOS

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup .NET 9
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    # Optional Developer ID signing + notarization. Add these repository secrets to enable it;
    # without them the apps are signed ad hoc. See MACOS_NOTES.md ("Signed releases").
    #   MACOS_CERTIFICATE      base64 of a .p12 export of the "Developer ID Application" certificate + key
    #   MACOS_CERTIFICATE_PWD  password of that .p12
    #   NOTARY_KEY             base64 of an App Store Connect API key (.p8)
    #   NOTARY_KEY_ID          that key's ID
    #   NOTARY_ISSUER_ID       the App Store Connect issuer ID
    - name: Import signing certificate
      env:
        MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
      run: |
        if [ -z "$MACOS_CERTIFICATE" ]; then
          echo "No MACOS_CERTIFICATE secret: apps will be signed ad hoc."
          exit 0
        fi
        KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
        KEYCHAIN_PWD="$(uuidgen)"
        echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
        security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
        security set-keychain-settings -lut 21600 "$KEYCHAIN"
        security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
        security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
        security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PWD" "$KEYCHAIN" > /dev/null
        security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
        rm "$RUNNER_TEMP/cert.p12"
        IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')"
        if [ -z "$IDENTITY" ]; then echo "::error::No Developer ID Application identity in MACOS_CERTIFICATE"; exit 1; fi
        echo "Signing as: $IDENTITY"
        echo "SIMITONE_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

    # build-mac-linux.sh --publish builds a self-contained Simitone.app (Eto.Forms needs an app bundle
    # for the installation picker). SIMITONE_ARCH picks the target, so one Apple Silicon runner builds both.
    - name: Publish macOS Intel app
      env:
        SIMITONE_ARCH: x64
      run: ./build-mac-linux.sh ${{ inputs.configuration || 'Release' }} --publish

    - name: Publish macOS Apple Silicon app
      env:
        SIMITONE_ARCH: arm64
      run: ./build-mac-linux.sh ${{ inputs.configuration || 'Release' }} --publish

    - name: Notarize app bundles
      env:
        NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
        NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
        NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
      run: |
        if [ -z "$SIMITONE_SIGN_IDENTITY" ] || [ -z "$NOTARY_KEY" ]; then
          echo "Signing certificate or notary key missing: skipping notarization."
          exit 0
        fi
        echo "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
        for arch in x64 arm64; do
          APP="publish/Simitone-macOS-$arch/Simitone.app"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$RUNNER_TEMP/notarize-$arch.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize-$arch.zip" \
            --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" \
            --wait --timeout 30m --output-format json | tee "$RUNNER_TEMP/notary-$arch.json"
          if ! grep -q '"status":"Accepted"' "$RUNNER_TEMP/notary-$arch.json"; then
            ID="$(sed -n 's/.*"id":"\([^"]*\)".*/\1/p' "$RUNNER_TEMP/notary-$arch.json")"
            [ -n "$ID" ] && xcrun notarytool log "$ID" --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID"
            echo "::error::Notarization of the $arch app was not accepted"
            exit 1
          fi
          xcrun stapler staple "$APP"
          spctl -a -vv -t exec "$APP"
        done
        rm "$RUNNER_TEMP/notary.p8"

    # upload-artifact drops executable bits and symlinks (Contents/Resources/Content is a symlink),
    # so zip each bundle with ditto first, which preserves them
    - name: Zip app bundles
      run: |
        for arch in x64 arm64; do
          test -x "publish/Simitone-macOS-$arch/Simitone.app/Contents/MacOS/Simitone"
          file "publish/Simitone-macOS-$arch/Simitone.app/Contents/MacOS/Simitone"
          mkdir -p "release/Simitone-macOS-$arch"
          codesign --verify --deep --strict "publish/Simitone-macOS-$arch/Simitone.app"
          ditto -c -k --keepParent "publish/Simitone-macOS-$arch/Simitone.app" "release/Simitone-macOS-$arch/Simitone-macOS-$arch.zip"
        done
        ls -la release/*

    - name: Upload macOS Intel artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Simitone-macOS-x64-${{ inputs.configuration || 'Release' }}
        path: release/Simitone-macOS-x64/
        if-no-files-found: error

    - name: Upload macOS ARM artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Simitone-macOS-arm64-${{ inputs.configuration || 'Release' }}
        path: release/Simitone-macOS-arm64/
        if-no-files-found: error

    - name: Remove signing keychain
      if: always()
      run: |
        if [ -f "$RUNNER_TEMP/signing.keychain-db" ]; then security delete-keychain "$RUNNER_TEMP/signing.keychain-db"; fi
